name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: profiler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show files
        run: ls -la && ls -la packages/profiler_blocker

      - name: Flutter version
        run: flutter --version

      # Generates the standard Android boilerplate (Gradle files, launcher
      # icons, etc.). Existing files — lib/, MainActivity.kt, the plugin —
      # are never overwritten.
      - name: Generate platform boilerplate
        run: flutter create --org com.vamsee --project-name profiler --platforms android .

      - name: App name and minSdk
        run: |
          sed -i 's/android:label="profiler"/android:label="Profiler"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          grep -n "minSdk" android/app/build.gradle* || true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: profiler-debug-apk
          path: profiler/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
